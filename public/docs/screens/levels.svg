<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Écran Niveaux de Signal Nocturne</title><desc id="desc">Dialogue de bibliothèque à deux profondeurs affichant les cinq familles et leur progression.</desc><defs><linearGradient id="bg"><stop stop-color="#10232d"/><stop offset="1" stop-color="#05090d"/></linearGradient><pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse"><rect width="72" height="72" fill="#182027"/><rect width="72" height="72" fill="none" stroke="#34414a"/></pattern></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="80" fill="#050a0e" stroke="#26343d"/><text x="34" y="49" fill="#35ddf3" font-size="32">✣</text><text x="78" y="37" fill="#dce8ed" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">SIGNAL NOCTURNE</text><rect x="267" y="20" width="45" height="23" rx="12" fill="#102d50" stroke="#75b8ff"/><text x="289" y="36" text-anchor="middle" fill="#bdddff" font-size="11">V27</text><rect x="470" y="145" width="500" height="500" fill="url(#grid)" stroke="#526069" stroke-width="7" opacity=".5"/><rect width="1440" height="900" fill="#010508" opacity=".72"/><rect x="270" y="75" width="900" height="750" fill="#080e12" stroke="#3c6470" stroke-width="2"/><rect x="270" y="75" width="900" height="92" fill="#101b21" stroke="#29414b"/><text x="310" y="108" fill="#71838d" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">BIBLIOTHÈQUE</text><text x="310" y="141" fill="#35ddf3" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">FAMILLES</text><rect x="1090" y="96" width="50" height="50" fill="#0b1318" stroke="#3f555f"/><text x="1115" y="132" text-anchor="middle" fill="#9fb2ba" font-size="30">×</text><text x="310" y="202" fill="#82939c" font-family="Arial,sans-serif" font-size="12">Choisissez une famille pour afficher ses tableaux, scores et derniers plans.</text>
