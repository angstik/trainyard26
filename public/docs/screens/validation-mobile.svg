<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">Écran de validation mobile d’un design</title>
  <desc id="desc">Vue mobile annotée du bilan combinatoire, des erreurs structurelles et de la portée du contrôle.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10232d"/><stop offset="1" stop-color="#05090d"/></linearGradient></defs>
  <rect width="430" height="932" fill="url(#bg)"/><rect width="430" height="932" fill="#010508" opacity=".7"/><rect x="8" y="12" width="414" height="908" fill="#080e12" stroke="#3c6470" stroke-width="2"/><rect x="8" y="12" width="414" height="102" fill="#101b21" stroke="#29414b"/>
  <text x="26" y="42" fill="#71838d" font-family="Arial,sans-serif" font-size="8" letter-spacing="1.6">ÉDITEUR · CONTRÔLE DU TABLEAU</text><text x="26" y="76" fill="#35ddf3" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">VALIDATION DU DESIGN</text><text x="26" y="98" fill="#71838d" font-family="Arial,sans-serif" font-size="8">SIGNAL NOCTURNE · V27</text><rect x="366" y="34" width="38" height="38" fill="#0b1318" stroke="#3f555f"/><text x="385" y="62" text-anchor="middle" fill="#9fb2ba" font-size="24">×</text>
  <rect x="22" y="134" width="386" height="80" fill="#17110f" stroke="#6b4337"/><text x="42" y="165" fill="#ff8d68" font-family="Arial,sans-serif" font-size="16" font-weight="700">⚠ 2 PROBLÈMES</text><text x="42" y="190" fill="#c69a8e" font-family="Arial,sans-serif" font-size="10">Structure KO · correction requise</text>
  <text x="22" y="250" fill="#d8c28d" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">BILAN COMBINATOIRE</text><rect x="22" y="265" width="386" height="170" fill="#0b1419" stroke="#2c414b"/><text x="42" y="292" fill="#71838d" font-family="Arial,sans-serif" font-size="8">PRODUITS · 3 TRAINS</text><circle cx="48" cy="321" r="9" fill="#e92f45"/><text x="67" y="325" fill="#dce8ed" font-family="Arial,sans-serif" font-size="11">Rouge × 1</text><circle cx="162" cy="321" r="9" fill="#258cff"/><text x="181" y="325" fill="#dce8ed" font-family="Arial,sans-serif" font-size="11">Bleu × 2</text><text x="42" y="359" fill="#71838d" font-family="Arial,sans-serif" font-size="8">ATTENDUS · 3 TRAINS</text><circle cx="48" cy="386" r="9" fill="#e92f45"/><text x="67" y="390" fill="#dce8ed" font-family="Arial,sans-serif" font-size="11">× 1</text><circle cx="116" cy="386" r="9" fill="#258cff"/><text x="135" y="390" fill="#dce8ed" font-family="Arial,sans-serif" font-size="11">× 2</text><text x="388" y="323" text-anchor="end" fill="#53d98c" font-family="Arial,sans-serif" font-size="10">✓ COULEURS</text><text x="388" y="389" text-anchor="end" fill="#53d98c" font-family="Arial,sans-serif" font-size="10">✓ QUANTITÉS</text>
  <text x="22" y="472" fill="#d8c28d" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">ERREURS STRUCTURELLES</text><rect x="22" y="487" width="386" height="172" fill="#1a0d10" stroke="#6b2f38"/><circle cx="45" cy="520" r="11" fill="#6f202a"/><text x="45" y="524" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="10">1</text><text x="65" y="515" fill="#ff9a9f" font-family="Arial,sans-serif" font-size="10" font-weight="700">Remise : connecteur obstrué</text><text x="65" y="538" fill="#b78386" font-family="Arial,sans-serif" font-size="9">Case (1,3) · obstacle incompatible</text><line x1="42" y1="558" x2="388" y2="558" stroke="#52262e"/><circle cx="45" cy="592" r="11" fill="#6f202a"/><text x="45" y="596" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="10">2</text><text x="65" y="587" fill="#ff9a9f" font-family="Arial,sans-serif" font-size="10" font-weight="700">Splitter placé en bordure</text><text x="65" y="610" fill="#b78386" font-family="Arial,sans-serif" font-size="9">Déplacer vers une case intérieure</text>
  <text x="22" y="696" fill="#d8c28d" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">PORTÉE DU CONTRÔLE</text><rect x="22" y="711" width="386" height="115" fill="#0a171d" stroke="#276b4b"/><text x="42" y="742" fill="#53d98c" font-family="Arial,sans-serif" font-size="10">✓ Couleurs et quantités</text><text x="42" y="770" fill="#53d98c" font-family="Arial,sans-serif" font-size="10">✓ Connecteurs et infrastructures</text><text x="42" y="798" fill="#82939c" font-family="Arial,sans-serif" font-size="9">— Sans recherche de chemin ni timing</text><rect x="237" y="852" width="171" height="42" fill="#10242b" stroke="#278fa0"/><text x="322" y="878" text-anchor="middle" fill="#35ddf3" font-family="Arial,sans-serif" font-size="9" letter-spacing="1">RETOUR ÉDITEUR</text>
  <g id="annotations" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle"><g transform="translate(408 137)"><circle r="16" fill="#258cff" stroke="#fff" stroke-width="2"/><text y="5" fill="#fff">1</text></g><g transform="translate(408 267)"><circle r="16" fill="#258cff" stroke="#fff" stroke-width="2"/><text y="5" fill="#fff">2</text></g><g transform="translate(408 489)"><circle r="16" fill="#258cff" stroke="#fff" stroke-width="2"/><text y="5" fill="#fff">3</text></g><g transform="translate(408 713)"><circle r="16" fill="#258cff" stroke="#fff" stroke-width="2"/><text y="5" fill="#fff">4</text></g></g>
</svg>
