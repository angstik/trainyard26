<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Écran de validation d’un design de niveau</title><desc id="desc">Éditeur assombri derrière un dialogue de validation montrant productions, attentes et erreurs structurelles localisées.</desc><defs><linearGradient id="bg"><stop stop-color="#10232d"/><stop offset="1" stop-color="#05090d"/></linearGradient><pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse"><rect width="72" height="72" fill="#182027"/><rect width="72" height="72" fill="none" stroke="#34414a"/></pattern></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="80" fill="#050a0e"/><text x="34" y="49" fill="#35ddf3" font-size="32">✣</text><text x="78" y="37" fill="#dce8ed" font-family="Arial,sans-serif" font-size="17" font-weight="700">SIGNAL NOCTURNE</text><rect x="267" y="20" width="45" height="23" rx="12" fill="#102d50" stroke="#75b8ff"/><text x="289" y="36" text-anchor="middle" fill="#bdddff" font-size="11">V27</text><rect x="470" y="118" width="500" height="500" fill="url(#grid)" stroke="#526069" stroke-width="7"/><rect x="42" y="660" width="1356" height="180" fill="#0a1117" stroke="#263640"/><g fill="#10191f" stroke="#293943"><rect x="70" y="686" width="100" height="78"/><rect x="180" y="686" width="100" height="78"/><rect x="290" y="686" width="100" height="78"/><rect x="400" y="686" width="100" height="78"/><rect x="510" y="686" width="100" height="78"/><rect x="620" y="686" width="100" height="78"/><rect x="730" y="686" width="100" height="78"/><rect x="840" y="686" width="100" height="78"/></g><rect width="1440" height="900" fill="#010508" opacity=".74"/>
<rect x="320" y="54" width="800" height="792" fill="#080e12" stroke="#3c6470" stroke-width="2"/><rect x="320" y="54" width="800" height="94" fill="#101b21" stroke="#29414b"/><text x="356" y="88" fill="#71838d" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">ÉDITEUR · CONTRÔLE DU TABLEAU</text><text x="356" y="122" fill="#35ddf3" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="2">VALIDATION DU DESIGN</text><rect x="1040" y="76" width="50" height="50" fill="#0b1318" stroke="#3f555f"/><text x="1065" y="112" text-anchor="middle" fill="#9fb2ba" font-size="30">×</text>
