<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">Écran Niveaux mobile de Signal Nocturne</title>
  <desc id="desc">Vue mobile annotée de la bibliothèque à deux profondeurs, montrant les familles et leur progression.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10232d"/><stop offset="1" stop-color="#05090d"/></linearGradient></defs>
  <rect width="430" height="932" fill="url(#bg)"/><rect width="430" height="932" fill="#010508" opacity=".64"/><rect x="8" y="18" width="414" height="896" fill="#080e12" stroke="#3c6470" stroke-width="2"/><rect x="8" y="18" width="414" height="104" fill="#101b21" stroke="#29414b"/>
  <text x="28" y="48" fill="#71838d" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.8">BIBLIOTHÈQUE · V27</text><text x="28" y="84" fill="#35ddf3" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2.5">FAMILLES</text><rect x="360" y="40" width="42" height="42" fill="#0b1318" stroke="#3f555f"/><text x="381" y="70" text-anchor="middle" fill="#9fb2ba" font-size="26">×</text>
  <text x="28" y="151" fill="#82939c" font-family="Arial,sans-serif" font-size="10">Touchez une famille pour ouvrir ses tableaux.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(22 174)"><rect width="386" height="105" fill="#0b1419" stroke="#3d7180"/><text x="18" y="34" fill="#d8c28d" font-size="15" font-weight="700" letter-spacing="1.5">CALGARY</text><text x="18" y="57" fill="#71838d" font-size="9">INITIATION · CROISEMENTS</text><rect x="18" y="75" width="280" height="7" fill="#17242b"/><rect x="18" y="75" width="224" height="7" fill="#35ddf3"/><text x="326" y="54" fill="#35ddf3" font-size="12">8 / 10</text><text x="355" y="65" fill="#35ddf3" font-size="26">›</text></g><g transform="translate(22 291)"><rect width="386" height="105" fill="#0b1419" stroke="#2c414b"/><text x="18" y="34" fill="#d8c28d" font-size="15" font-weight="700" letter-spacing="1.5">EDMONTON</text><text x="18" y="57" fill="#71838d" font-size="9">MÉLANGES · COULEURS</text><rect x="18" y="75" width="280" height="7" fill="#17242b"/><rect x="18" y="75" width="140" height="7" fill="#35ddf3"/><text x="326" y="54" fill="#35ddf3" font-size="12">5 / 10</text><text x="355" y="65" fill="#35ddf3" font-size="26">›</text></g><g transform="translate(22 408)"><rect width="386" height="105" fill="#0b1419" stroke="#2c414b"/><text x="18" y="34" fill="#d8c28d" font-size="15" font-weight="700" letter-spacing="1.5">SASKATOON</text><text x="18" y="57" fill="#71838d" font-size="9">SPLITTERS · SYNCHRONISATION</text><rect x="18" y="75" width="280" height="7" fill="#17242b"/><rect x="18" y="75" width="84" height="7" fill="#35ddf3"/><text x="326" y="54" fill="#35ddf3" font-size="12">3 / 10</text><text x="355" y="65" fill="#35ddf3" font-size="26">›</text></g><g transform="translate(22 525)"><rect width="386" height="105" fill="#0b1419" stroke="#2c414b"/><text x="18" y="34" fill="#d8c28d" font-size="15" font-weight="700" letter-spacing="1.5">REGINA</text><text x="18" y="57" fill="#71838d" font-size="9">ROCHERS · DÉTOURS DENSES</text><rect x="18" y="75" width="280" height="7" fill="#17242b"/><rect x="18" y="75" width="56" height="7" fill="#35ddf3"/><text x="326" y="54" fill="#35ddf3" font-size="12">2 / 10</text><text x="355" y="65" fill="#35ddf3" font-size="26">›</text></g><g transform="translate(22 642)"><rect width="386" height="105" fill="#0b1419" stroke="#2c414b"/><text x="18" y="34" fill="#d8c28d" font-size="15" font-weight="700" letter-spacing="1.5">ATLANTIS</text><text x="18" y="57" fill="#71838d" font-size="9">SYNTHÈSE · 6 TABLEAUX</text><rect x="18" y="75" width="280" height="7" fill="#17242b"/><rect x="18" y="75" width="47" height="7" fill="#35ddf3"/><text x="326" y="54" fill="#35ddf3" font-size="12">1 / 6</text><text x="355" y="65" fill="#35ddf3" font-size="26">›</text></g></g>
  <rect x="22" y="775" width="386" height="94" fill="#070d11" stroke="#29414b"/><text x="40" y="808" fill="#35ddf3" font-family="Arial,sans-serif" font-size="10">REPRISE CONTEXTUELLE</text><text x="40" y="831" fill="#71838d" font-family="Arial,sans-serif" font-size="9">Famille ouverte et position restaurées</text><text x="40" y="850" fill="#71838d" font-family="Arial,sans-serif" font-size="9">au retour dans le menu.</text>
  <g id="annotations" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle"><g transform="translate(15 131)"><circle r="16" fill="#258cff" stroke="#fff" stroke-width="2"/><text y="5" fill="#fff">1</text></g><g transform="translate(408 224)"><circle r="16" fill="#258cff" stroke="#fff" stroke-width="2"/><text y="5" fill="#fff">2</text></g><g transform="translate(408 785)"><circle r="16" fill="#258cff" stroke="#fff" stroke-width="2"/><text y="5" fill="#fff">3</text></g><g transform="translate(404 38)"><circle r="16" fill="#258cff" stroke="#fff" stroke-width="2"/><text y="5" fill="#fff">4</text></g></g>
</svg>
