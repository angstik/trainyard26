<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Flux des états et sauvegardes</title><desc id="desc">Le niveau charge un plan éditable, lance une simulation isolée et enregistre progression et navigation dans le stockage navigateur.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#35ddf3"/></marker></defs><rect width="1200" height="500" rx="20" fill="#071014" stroke="#2d414b"/><text x="48" y="54" fill="#d8bd78" font-family="Arial,sans-serif" font-size="22" font-weight="700">ÉTATS, PLAN ET PERSISTANCE</text><g font-family="Arial,sans-serif"><g transform="translate(60 105)"><rect width="260" height="115" rx="8" fill="#0b1419" stroke="#d8bd78"/><text x="130" y="34" text-anchor="middle" fill="#d8bd78" font-size="15" font-weight="700">LEVEL DEFINITION</text><text x="130" y="65" text-anchor="middle" fill="#82939c" font-size="12">objets · budget · plan initial</text></g><g transform="translate(470 105)"><rect width="260" height="115" rx="8" fill="#10232b" stroke="#35ddf3"/><text x="130" y="34" text-anchor="middle" fill="#35ddf3" font-size="15" font-weight="700">PLAN ÉDITABLE</text><text x="130" y="62" text-anchor="middle" fill="#a7bbc3" font-size="12">edges · modes · toes</text><text x="130" y="84" text-anchor="middle" fill="#a7bbc3" font-size="12">positions · chrono</text></g><g transform="translate(880 105)"><rect width="260" height="115" rx="8" fill="#0b1419" stroke="#a65be2"/><text x="130" y="34" text-anchor="middle" fill="#a65be2" font-size="15" font-weight="700">SIM DATA</text><text x="130" y="62" text-anchor="middle" fill="#82939c" font-size="12">trains · emitted · received</text><text x="130" y="84" text-anchor="middle" fill="#82939c" font-size="12">switches · interactions</text></g><path d="M320 163h140M730 163h140" stroke="#35ddf3" stroke-width="3" marker-end="url(#a)"/><text x="390" y="149" text-anchor="middle" fill="#71838d" font-size="11">loadLevel</text><text x="800" y="149" text-anchor="middle" fill="#71838d" font-size="11">launch</text><g transform="translate(260 325)"><rect width="300" height="105" rx="8" fill="#0b1419" stroke="#35c978"/><text x="150" y="34" text-anchor="middle" fill="#35c978" font-size="15" font-weight="700">LEVEL PROGRESS</text><text x="150" y="64" text-anchor="middle" fill="#82939c" font-size="12">minimum · dernier · temps · plan</text></g><g transform="translate(650 325)"><rect width="300" height="105" rx="8" fill="#0b1419" stroke="#258cff"/><text x="150" y="34" text-anchor="middle" fill="#75b8ff" font-size="15" font-weight="700">NAVIGATION</text><text x="150" y="64" text-anchor="middle" fill="#82939c" font-size="12">famille · scroll · dépôt éditeur</text></g><path d="M600 220v70H410v25" fill="none" stroke="#35c978" stroke-width="3" marker-end="url(#a)"/><path d="M600 220v70H800v25" fill="none" stroke="#258cff" stroke-width="3" marker-end="url(#a)"/><text x="600" y="278" text-anchor="middle" fill="#71838d" font-size="11">localStorage / sessionStorage</text></g><g id="annotations" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><g transform="translate(60 101)"><circle r="18" fill="#258cff" stroke="#fff" stroke-width="3"/><text y="6" fill="#fff">A</text></g><g transform="translate(470 101)"><circle r="18" fill="#258cff" stroke="#fff" stroke-width="3"/><text y="6" fill="#fff">B</text></g><g transform="translate(1138 101)"><circle r="18" fill="#258cff" stroke="#fff" stroke-width="3"/><text y="6" fill="#fff">C</text></g><g transform="translate(952 429)"><circle r="18" fill="#258cff" stroke="#fff" stroke-width="3"/><text y="6" fill="#fff">D</text></g></g></svg>
