<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Séquence d’un tick de simulation</title><desc id="desc">Deux rangées montrent l’émission, l’avancement, les infrastructures, le routage, les rencontres, la publication et le résultat.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#35ddf3"/></marker></defs><rect width="1200" height="500" rx="20" fill="#071014" stroke="#2d414b"/><text x="48" y="54" fill="#d8bd78" font-family="Arial,sans-serif" font-size="22" font-weight="700">ORDRE STRICT D’UN TICK · 25 ms</text><g font-family="Arial,sans-serif"><g transform="translate(55 100)"><rect width="210" height="105" rx="8" fill="#10232b" stroke="#35ddf3"/><text x="105" y="34" text-anchor="middle" fill="#35ddf3" font-size="15" font-weight="700">1 · ÉMETTRE</text><text x="105" y="65" text-anchor="middle" fill="#82939c" font-size="12">remises prêtes</text></g><g transform="translate(315 100)"><rect width="210" height="105" rx="8" fill="#10232b" stroke="#35ddf3"/><text x="105" y="34" text-anchor="middle" fill="#35ddf3" font-size="15" font-weight="700">2 · AVANCER</text><text x="105" y="65" text-anchor="middle" fill="#82939c" font-size="12">progression continue</text></g><g transform="translate(575 100)"><rect width="210" height="105" rx="8" fill="#10232b" stroke="#35ddf3"/><text x="105" y="34" text-anchor="middle" fill="#35ddf3" font-size="15" font-weight="700">3 · TRANSFORMER</text><text x="105" y="65" text-anchor="middle" fill="#82939c" font-size="12">gare · painter · splitter</text></g><g transform="translate(835 100)"><rect width="210" height="105" rx="8" fill="#10232b" stroke="#35ddf3"/><text x="105" y="34" text-anchor="middle" fill="#35ddf3" font-size="15" font-weight="700">4 · ROUTER</text><text x="105" y="65" text-anchor="middle" fill="#82939c" font-size="12">rail · croisement · switch</text></g><path d="M265 152h40M525 152h40M785 152h40" stroke="#35ddf3" stroke-width="3" marker-end="url(#a)"/><path d="M1045 152h70v140H945" fill="none" stroke="#35ddf3" stroke-width="3" marker-end="url(#a)"/><g transform="translate(835 290)"><rect width="210" height="105" rx="8" fill="#0b1419" stroke="#a65be2"/><text x="105" y="34" text-anchor="middle" fill="#a65be2" font-size="15" font-weight="700">5 · RENCONTRER</text><text x="105" y="65" text-anchor="middle" fill="#82939c" font-size="12">fusion · croisement · mix</text></g><g transform="translate(575 290)"><rect width="210" height="105" rx="8" fill="#0b1419" stroke="#35c978"/><text x="105" y="34" text-anchor="middle" fill="#35c978" font-size="15" font-weight="700">6 · PUBLIER</text><text x="105" y="65" text-anchor="middle" fill="#82939c" font-size="12">trains · compteurs · effets</text></g><g transform="translate(315 290)"><rect width="210" height="105" rx="8" fill="#0b1419" stroke="#d8bd78"/><text x="105" y="34" text-anchor="middle" fill="#d8bd78" font-size="15" font-weight="700">7 · CONCLURE</text><text x="105" y="61" text-anchor="middle" fill="#82939c" font-size="12">succès · échec · continuer</text></g><path d="M835 342h-40M575 342h-40" stroke="#35ddf3" stroke-width="3" marker-end="url(#a)"/><path d="M315 342H200V210" fill="none" stroke="#71838d" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#a)"/><text x="85" y="339" fill="#71838d" font-size="11">tick suivant</text></g><g id="annotations" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><g transform="translate(55 96)"><circle r="18" fill="#258cff" stroke="#fff" stroke-width="3"/><text y="6" fill="#fff">A</text></g><g transform="translate(1060 210)"><circle r="18" fill="#258cff" stroke="#fff" stroke-width="3"/><text y="6" fill="#fff">B</text></g><g transform="translate(1050 394)"><circle r="18" fill="#258cff" stroke="#fff" stroke-width="3"/><text y="6" fill="#fff">C</text></g><g transform="translate(315 396)